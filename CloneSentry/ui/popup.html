<!DOCTYPE html>
<html>
<head>
    <style>
        body { width: 330px; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background: #f8f9fa; }
        .header { background: #1a2a3a; color: white; padding: 15px; text-align: center; font-weight: bold; border-bottom: 3px solid #3498db; }
        .container { padding: 20px; }
        .status-card { border-radius: 10px; padding: 20px; text-align: center; color: white; background: #7f8c8d; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .status-card.safe { background: #27ae60 !important; }
        .status-card.warning { background: #f39c12 !important; }
        .status-card.danger { background: #c0392b !important; }
        #verdict { font-size: 18px; font-weight: bold; margin: 0; text-transform: uppercase; }
        .stats-box { background: white; border-radius: 8px; border: 1px solid #dee2e6; }
        .stat-row { display: flex; justify-content: space-between; padding: 12px 15px; border-bottom: 1px solid #eee; font-size: 13px; }
        .stat-row:last-child { border-bottom: none; }
        .label { color: #7f8c8d; font-weight: 500; }
        .value { font-weight: bold; color: #2c3e50; }
        button { width: 100%; padding: 14px; background: #3498db; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        button:hover { background: #2980b9; }
    </style>
</head>
<body>
    <div class="header">SpecterScan Supreme</div>
    <div class="container">
        <div id="status-card" class="status-card">
            <p id="verdict">Initializing...</p>
        </div>
        <div class="stats-box">
            <div class="stat-row">
                <span class="label">Security Engines</span>
                <span id="vt-hits" class="value">-</span>
            </div>
            <div class="stat-row">
                <span class="label">Domain Age</span>
                <span id="age" class="value">-</span>
            </div>
            <div class="stat-row">
                <span class="label">SSL Security</span>
                <span id="ssl" class="value">-</span>
            </div>
        </div>
        <button id="scanBtn">Scan Website</button>
    </div>
    <script src="popup.js"></script>
</body>
</html>
